<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--navy:#1f3a5f;--bg:#f4f6f9;--line:#dde3ea;--text:#1d2733;--muted:#66758a;--green:#1e7b4f;--amber:#a86400;--red:#b42318;--blue:#2457a6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .firm{font-weight:700;font-size:16px;margin-right:6px}
header .sp{flex:1}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
header .who{font-size:13px;opacity:.9}
main{max-width:1200px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:14px;margin:18px 0 6px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
h4{font-size:14px;margin:0 0 10px;color:var(--navy)}
button{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
button.ok{background:var(--green);color:#fff;border-color:var(--green)}
button.warn{color:var(--red);border-color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid #c9d2dc;border-radius:6px;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
tr.click:hover{background:#f0f5fb;cursor:pointer}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.s-OPEN{background:#e7effb;color:var(--blue)} .s-ASSEMBLY{background:#fdf1dc;color:var(--amber)} .s-LOCKED{background:#fde7e5;color:var(--red)}
.w-Not{background:#eef1f4;color:var(--muted)} .w-In{background:#e7effb;color:var(--blue)} .w-Prepared,.w-Awaiting{background:#fdf1dc;color:var(--amber)}
.w-Reviewed,.w-Partner{background:#e4f4ec;color:var(--green)} .w-Returned{background:#fde7e5;color:var(--red)}
.d-Confirmed,.d-Cleared{background:#e4f4ec;color:var(--green)} .d-Pending{background:#eef1f4;color:var(--muted)} .d-Disclosed{background:#fde7e5;color:var(--red)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:170px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.banner{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:13px}
.banner.OPEN{background:#e7effb;color:#183e78}.banner.ASSEMBLY{background:#fdf1dc;color:#6e4200}.banner.LOCKED,.banner.ret,.banner.bad{background:#fde7e5;color:#7a1810}
.banner.good{background:#e4f4ec;color:#0f4d30}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 10px;z-index:10}
.modal .box{background:#fff;border-radius:10px;max-width:780px;width:100%;padding:22px}
.hidden{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 16px;border-radius:6px;z-index:20;max-width:90%}
.toast.err{background:var(--red)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--blue);z-index:30}
.login{max-width:380px;margin:70px auto}
.chk{display:flex;flex-wrap:wrap;gap:6px 16px}
.chk label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400;color:var(--text);font-size:13px}
.chk input{width:auto}
.prog{height:6px;background:#e6eaef;border-radius:3px;overflow:hidden;width:110px;margin-top:4px}.prog>i{display:block;height:100%;background:var(--green)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 20px;font-size:13px}
.kv b{color:var(--muted);font-weight:600;font-size:12px;display:block}
.cl{list-style:none;padding:0;margin:0 0 12px}.cl li{padding:5px 0;font-size:13px;display:flex;gap:8px}.cl .y{color:var(--green);font-weight:700}.cl .n{color:var(--red);font-weight:700}
.decl{background:#f7f9fb;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.5}
td.det{font-size:12px;word-break:break-word;max-width:520px}
.warnic{color:var(--red);font-weight:700}
a{color:var(--blue)}
@media print{header,.bar,#busy,.toast{display:none!important}.card{border:none;padding:0}body{background:#fff}}
</style>
</head>
<body>
<div id="busy" class="hidden"></div>
<div id="hdr"></div>
<main id="main"></main>
<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const FIRM = <?!= JSON.stringify(firm) ?>;
const ASSEMBLY_DAYS = <?!= JSON.stringify(assemblyDays) ?>;
const ADMIN = <?!= JSON.stringify(admin) ?>;
const VERSION = <?!= JSON.stringify(version) ?>;
const SECTIONS = ['Planning','Risk assessment','Controls','Substantive','Head office','Completion','Reporting','Other'];
/* plant sections ("Plant L1 – Name") sit between Head office and Completion */
function sectionOf(w){ return (SECTIONS.indexOf(w.Section) >= 0 || w.LocCode) ? w.Section : 'Other'; }
function sectionOrder(wps){
  const plants = [];
  wps.filter(w => w.LocCode).sort((a, b) => Number(a.LocCode.slice(1)) - Number(b.LocCode.slice(1)))
    .forEach(w => { if (plants.indexOf(w.Section) < 0) plants.push(w.Section); });
  return ['Planning','Risk assessment','Controls','Substantive','Head office'].concat(plants, ['Completion','Reporting','Other']);
}
const ASSERTIONS = ['Existence / Occurrence','Completeness','Accuracy','Valuation & allocation','Rights & obligations','Cut-off','Classification','Presentation & disclosure'];
const RISKS = ['','Significant risk','Higher risk','Normal risk','Not applicable'];
const ENG_TYPES = ['Statutory Audit','Tax Audit','Internal Audit','Limited Review','Other Assurance'];
const S = {token:null, data:null, me:null, cur:null};
try { S.token = sessionStorage.getItem('ap_t'); } catch(e) {}

/* ---------- utilities ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){ u = String(u||'').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
function fmtD(ymd){ if(!ymd) return '—'; const p = ymd.slice(0,10).split('-'); return p.length===3 ? p[2]+'-'+p[1]+'-'+p[0] : ymd; }
function fmtDT(s){ return s ? fmtD(s) + ' ' + s.slice(11,16) : ''; }
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isPartner(){ return S.me && S.me.role === 'Partner'; }
function isMgr(){ return S.me && (S.me.role === 'Partner' || S.me.role === 'Manager'); }
function isAdmin(){ return S.me && S.me.username === ADMIN; }
function uname(u){ if(!u) return ''; const x = (S.data && S.data.users || []).find(z => z.Username === u); return x ? x.Name : u; }
function setToken(t){ S.token = t; try { sessionStorage.setItem('ap_t', t); } catch(e) {} }
function clearToken(){ S.token = null; try { sessionStorage.removeItem('ap_t'); } catch(e) {} }
let busyN = 0;
function busy(on){ busyN = Math.max(0, busyN + (on?1:-1)); $('busy').classList.toggle('hidden', busyN === 0); }
function toast(m, err){ const t = $('toast'); t.textContent = m; t.className = 'toast' + (err?' err':''); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), err ? 8000 : 3000); }
function modal(html){ $('mbox').innerHTML = html; $('modal').classList.remove('hidden'); window.scrollTo(0,0); }
function closeModal(){ $('modal').classList.add('hidden'); $('mbox').innerHTML = ''; }
function stateBadge(s){ const t = {OPEN:'Open', ASSEMBLY:'Assembly period', LOCKED:'Locked'}[s] || s; return `<span class="badge s-${s}">${t}</span>`; }
function wpBadge(s){ return `<span class="badge w-${esc(String(s).split(' ')[0])}">${esc(s)}</span>`; }
function opts(list, sel, labelFn){ return list.map(v => { const val = typeof v === 'object' ? v.v : v; const lab = typeof v === 'object' ? v.l : (labelFn ? labelFn(v) : v); return `<option value="${esc(val)}" ${String(val)===String(sel)?'selected':''}>${esc(lab)}</option>`; }).join(''); }
function activeUsers(roles){ return S.data.users.filter(u => u.Active === 'Yes' && u.Username !== ADMIN && (!roles || roles.indexOf(u.Role) >= 0)); }
function userOpts(roles, sel, blank){ return (blank?'<option value="">— none —</option>':'') + opts(activeUsers(roles).map(u => ({v:u.Username, l:u.Name+' ('+u.Role+')'})), sel); }
function teamChecks(selected){ const sel = String(selected||'').split(',').filter(String); return '<div class="chk">' + activeUsers().map(u => `<label><input type="checkbox" class="tm" value="${esc(u.Username)}" ${sel.indexOf(u.Username)>=0?'checked':''}>${esc(u.Name)}</label>`).join('') + '</div>'; }
function checked(cls){ return [...document.querySelectorAll('.'+cls+':checked')].map(x => x.value); }

/* server call: on error shows message; promise only resolves on success */
function call(fn, ...args){
  return new Promise(res => {
    busy(true);
    google.script.run
      .withSuccessHandler(r => { busy(false); res(r); })
      .withFailureHandler(e => {
        busy(false);
        const m = String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
        if (m.indexOf('SESSION_EXPIRED') >= 0) { clearToken(); closeModal(); renderLogin(); toast('Session expired – please log in again', true); }
        else toast(m, true);
      })[fn](...args);
  });
}

/* ---------- login ---------- */
function renderLogin(){
  $('hdr').innerHTML = '';
  $('main').innerHTML = `<div class="card login">
    <div class="muted">${esc(FIRM)}</div><h2>Audit Portal – Login</h2>
    <label>Username</label><input id="lu" autocomplete="username" autocapitalize="off">
    <label>Password</label><input id="lp" type="password" autocomplete="current-password">
    <div style="margin-top:16px"><button class="pri" id="lb">Log in</button></div>
    <p class="muted">Version ${esc(VERSION)}</p></div>`;
  const go = () => call('login', $('lu').value, $('lp').value).then(r => { setToken(r.token); loadHome(); });
  $('lb').onclick = go;
  $('lp').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('lu').focus();
}
function logout(){ const t = S.token; clearToken(); S.data = null; renderLogin(); if (t) google.script.run.logout(t); }

function renderHeader(){
  $('hdr').innerHTML = `<header><span class="firm">${esc(FIRM)}</span><span>Audit Portal</span><span class="sp"></span>
    <button onclick="loadHome()">Engagements</button>
    ${isMgr() ? '<button onclick="showLog()">Audit trail</button>' : ''}
    ${isPartner() ? '<button onclick="showIntegrity()">Verify integrity</button><button onclick="showUsers()">Users</button>' : ''}
    <button onclick="changePw()">Change password</button>
    <span class="who">${esc(S.me.name)} · ${esc(S.me.role)}</span>
    <button onclick="logout()">Log out</button></header>`;
}

/* ---------- home ---------- */
function loadHome(){ call('getBootstrap', S.token).then(d => { S.data = d; S.me = d.me; renderHeader(); renderHome(); }); }
function renderHome(){
  const d = S.data;
  const rows = d.engagements.map(e => {
    const pct = e.total ? Math.round(e.done / e.total * 100) : 0;
    return `<tr class="click" data-k="${esc((e.ClientName+' '+e.FY+' '+e.EngType+' '+uname(e.Partner)).toLowerCase())}" onclick="openEng('${esc(e.EngId)}')">
      <td><b>${esc(e.ClientName)}</b>${e.intact ? '' : ' <span class="warnic" title="Integrity alert">⚠</span>'}<div class="muted">${esc(e.EngType)}${e.myRole ? ' · You: ' + esc(e.myRole) : ''}</div></td><td>${esc(e.FY)}</td>
      <td>${esc(uname(e.Partner))}</td><td>${e.EqcrRequired === 'Yes' ? esc(uname(e.Eqcr) || 'Not assigned') : '—'}</td><td>${fmtD(e.ReportDate)}</td><td>${stateBadge(e.state)}</td>
      <td>${e.done}/${e.total} complete${e.returned?` · <span style="color:var(--red)">${e.returned} returned</span>`:''}<div class="prog"><i style="width:${pct}%"></i></div></td></tr>`;
  }).join('');
  $('main').innerHTML = (isAdmin() ? `<div class="banner bad">You are using the setup <b>admin</b> login. Use it only to create named logins for each partner, manager and staff member (Users). The admin login cannot be assigned to engagements or sign anything. Once named partner logins exist, a partner should deactivate this login.</div>` : '') +
    `<div class="card">
    <div class="bar" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Engagements</h2>
      <div class="bar">${isMgr() && !isAdmin() ? '<button onclick="newClient()">+ New client</button><button class="pri" onclick="newEng()">+ New engagement</button>' : ''}</div></div>
    <input id="q" placeholder="Search client, year, partner…" style="margin-bottom:10px">
    <table><thead><tr><th>Client</th><th>FY</th><th>Partner</th><th>EQCR</th><th>Report date</th><th>File status</th><th>Progress</th></tr></thead>
    <tbody id="etb">${rows || '<tr><td colspan="7" class="muted">No engagements yet.' + (isMgr() ? ' Add a client, then create an engagement.' : ' Ask your manager to add you to an engagement team.') + '</td></tr>'}</tbody></table></div>`;
  $('q').oninput = () => { const q = $('q').value.toLowerCase(); document.querySelectorAll('#etb tr[data-k]').forEach(tr => tr.style.display = tr.dataset.k.indexOf(q) >= 0 ? '' : 'none'); };
}

function newClient(){
  modal(`<h2>New client</h2>
    <label>Client name *</label><input id="cn">
    <div class="row"><div><label>CIN / LLPIN</label><input id="ccin"></div><div><label>PAN</label><input id="cpan"></div></div>
    <label>Entity type</label><select id="ct">${opts(['Listed company','Unlisted public company','Private company','LLP','Partnership firm','Trust / Society','Other'])}</select>
    <p class="muted">Listed companies automatically require an Engagement Quality Control Review (SQC 1).</p>
    <div class="bar" style="margin-top:14px"><button class="pri" id="sv">Save client</button><button onclick="closeModal()">Cancel</button></div>`);
  $('sv').onclick = () => call('saveClient', S.token, {ClientName:$('cn').value, CIN:$('ccin').value, PAN:$('cpan').value, EntityType:$('ct').value})
    .then(d => { S.data = d; closeModal(); renderHome(); toast('Client added'); });
}

function defaultFY(){ const n = new Date(); const y = n.getMonth() >= 3 ? n.getFullYear() : n.getFullYear() - 1; return (y-1) + '-' + String(y).slice(2); }
function eqcrFields(listed, req, sel){
  return `<div class="row"><div><label>EQCR required?</label><select id="eqr" ${listed?'disabled':''}>${opts(['No','Yes'], listed ? 'Yes' : req)}</select>
    ${listed ? '<div class="muted">Mandatory – listed entity (SQC 1)</div>' : '<div class="muted">Per firm policy for non-listed entities</div>'}</div>
    <div><label>EQCR reviewer (must not be on the team)</label><select id="eqp">${userOpts(['Partner','Manager'], sel, true)}</select></div></div>`;
}
function clientListed(clientId){ const c = S.data.clients.find(x => x.ClientId === clientId); return !!c && c.EntityType === 'Listed company'; }
function newEng(){
  if (!S.data.clients.length) { toast('Add a client first', true); return; }
  if (!activeUsers(['Partner']).length) { toast('Create a named Partner login first (Users)', true); return; }
  modal(`<h2>New engagement</h2>
    <label>Client *</label><select id="ec">${opts(S.data.clients.map(c => ({v:c.ClientId, l:c.ClientName + (c.EntityType ? ' – ' + c.EntityType : '')})))}</select>
    <div class="row"><div><label>Financial year *</label><input id="efy" value="${defaultFY()}" placeholder="2025-26"></div>
    <div><label>Engagement type</label><select id="et">${opts(ENG_TYPES)}</select></div></div>
    <div class="row"><div><label>Engagement partner *</label><select id="ep">${userOpts(['Partner'], isPartner() ? S.me.username : '')}</select></div>
    <div><label>Manager</label><select id="em">${userOpts(['Manager','Partner'], S.me.role === 'Manager' ? S.me.username : '', true)}</select></div></div>
    <label>Engagement team (only these people can work on the file)</label>${teamChecks('')}
    <div id="eqbox"></div>
    <label>File template</label><select id="etp">${opts([{v:'standard', l:'Standard statutory audit (A–F, 34 papers)'}, {v:'plant', l:'Multi-location plant audit on SAP S/4HANA (A–F + head office H1–H8 + 12 papers per plant)'}])}</select>
    <div class="row"><div><label>Joint auditor – firm name (leave blank if none)</label><input id="eja" placeholder="e.g. ABC & Co, Chartered Accountants"></div>
    <div><label>Joint auditor FRN</label><input id="ejf" placeholder="e.g. 123456W"></div></div>
    <p class="muted">A joint auditor adds the SA 299 papers A6, A7, E7 and F5 and lets a partner allot papers or whole plants to the joint auditor or as common areas. Plants are added after creation, from the engagement page. Every team member and the EQCR reviewer must make an independence declaration before working on the file.</p>
    <div class="bar" style="margin-top:12px"><button class="pri" id="sv">Create engagement</button><button onclick="closeModal()">Cancel</button></div>`);
  const drawEq = () => { $('eqbox').innerHTML = eqcrFields(clientListed($('ec').value), 'No', ''); };
  drawEq(); $('ec').onchange = drawEq;
  $('sv').onclick = () => call('createEngagement', S.token, {ClientId:$('ec').value, FY:$('efy').value, EngType:$('et').value, Partner:$('ep').value,
      Manager:$('em').value, Team:checked('tm'), EqcrRequired:$('eqr').value, Eqcr:$('eqp').value,
      Template:$('etp').value, JointAuditor:$('eja').value, JointAuditorFrn:$('ejf').value})
    .then(r => { closeModal(); toast('Engagement created'); openEng(r.engId); });
}

/* ---------- engagement file ---------- */
function openEng(id){ call('getWorkingPapers', S.token, id).then(r => { S.cur = r; renderEng(); }); }
function refresh(r, msg){ S.cur = r; closeModal(); renderEng(); if (msg) toast(msg); }

function renderEng(){
  const r = S.cur, e = r.eng, m = r.me;
  const ban = {
    OPEN: 'File open – working papers can be edited and signed off. The report date can be recorded only by the engagement partner, through "Approve & date report", once the completion checklist is fully met.',
    ASSEMBLY: `Audit report dated ${fmtD(e.ReportDate)} (approved by ${esc(uname(e.ApprovedBy))}). Assembly period runs until ${fmtD(r.assemblyEnd)} (${ASSEMBLY_DAYS} days – SA 230). Only administrative / assembly changes now; each change needs a reason and is recorded.`,
    LOCKED: `File locked – assembly period ended on ${fmtD(r.assemblyEnd)}. Only a Partner can make an exceptional change, with reason, as permitted by SA 230.`
  }[r.state];
  const tamperedWps = r.wps.filter(w => w.tampered);
  const integrity = (r.engTampered || tamperedWps.length) ? `<div class="banner bad"><b>⚠ Integrity alert:</b> ${r.engTampered ? 'the engagement record' : ''}${r.engTampered && tamperedWps.length ? ' and ' : ''}${tamperedWps.length ? 'working paper(s) ' + tamperedWps.map(w => esc(w.Ref)).join(', ') : ''} changed outside the portal. Work on the affected records is blocked until a partner investigates.
      ${isPartner() && !isAdmin() && r.engTampered ? ` <button class="warn" onclick="resolveInt('')">Resolve engagement alert</button>` : ''}</div>` : '';
  const myDecl = r.decls.find(d => d.Username === S.me.username);
  const declNeeded = m.required && !m.declOk;
  const team = String(e.Team||'').split(',').filter(String).map(uname).join(', ') || '—';

  let body = '';
  sectionOrder(r.wps).forEach(sec => {
    const list = r.wps.filter(w => sectionOf(w) === sec);
    if (!list.length) return;
    const loc = list[0].LocCode ? r.locations.find(l => l.LocCode === list[0].LocCode) : null;
    body += `<h3>${esc(sec)}${loc && loc.GSTIN ? ` <span class="muted" style="text-transform:none">· GSTIN ${esc(loc.GSTIN)}</span>` : ''}${loc && loc.Allocation ? ` <span class="badge w-Awaiting" style="text-transform:none">${esc(loc.Allocation)}</span>` : ''}</h3><table><thead><tr><th style="width:60px">Ref</th><th>Working paper</th><th style="width:120px">Status</th><th style="width:150px">Prepared</th><th style="width:150px">Reviewed</th><th style="width:150px">Partner</th><th style="width:36px">v</th></tr></thead><tbody>` +
      list.map(w => { const nEv = w.attachments.filter(a => a.Status === 'Current').length + w.pfLinks.length;
        const ja = w.Allocation === 'Joint auditor';
        return `<tr class="click" ${ja ? 'style="opacity:.55"' : ''} onclick="openWp('${esc(w.WpId)}')"><td><b>${esc(w.Ref)}</b>${w.tampered ? ' <span class="warnic">⚠</span>' : ''}</td><td>${esc(w.Title)}${nEv ? ` <span class="muted" title="Evidence files and permanent file references">📎 ${nEv}</span>` : ''}${w.Allocation ? ` <span class="badge ${ja ? 'w-Not' : 'w-Awaiting'}">${esc(w.Allocation)}</span>` : ''}${w.Risk?`<div class="muted">${esc(w.Risk)}</div>`:''}</td>
        <td>${wpBadge(w.Status)}</td><td>${w.PreparedBy?esc(uname(w.PreparedBy))+'<div class="muted">'+fmtDT(w.PreparedAt)+'</div>':'—'}</td>
        <td>${w.ReviewedBy?esc(uname(w.ReviewedBy))+'<div class="muted">'+fmtDT(w.ReviewedAt)+'</div>':'—'}</td>
        <td>${!w.needsPartner ? '<span class="muted">Not required</span>' : (w.PartnerBy ? esc(uname(w.PartnerBy))+'<div class="muted">'+fmtDT(w.PartnerAt)+'</div>' : '<span style="color:var(--amber)">Required</span>')}</td>
        <td>${esc(w.Version)}</td></tr>`; }).join('') + '</tbody></table>';
  });

  const declRows = r.decls.map(d => `<tr><td>${esc(uname(d.Username))}<div class="muted">${esc(d.Roles)}</div></td>

    ${integrity}

        ${m.required && myDecl && myDecl.Status !== 'Disclosed' ? '<div class="bar" style="margin-top:10px"><button onclick="declForm()">Update my declaration</button></div>' : ''}</div>
    </div>

    ${plantsCard(r)}

/* ---------- plants / locations and joint audit allocation (v1.3) ---------- */
function canWork(r){ return r.me.isTeam && r.me.declOk && !isAdmin(); }
const RISK_ORDER = {High: 0, Medium: 1, Low: 2, '': 3};
function plantsCard(r){
  const e = r.eng, canAdd = canWork(r) && r.state === 'OPEN';
  if (!r.locations.length && e.Template !== 'plant' && !canAdd) return '';
  const mgr = canWork(r) && isMgr();
  const locs = r.locations.slice().sort((a, b) => (RISK_ORDER[a.RiskRating || ''] - RISK_ORDER[b.RiskRating || '']) || (Number(a.LocCode.slice(1)) - Number(b.LocCode.slice(1))));
  const jaCell = (papers, confs, scope) => !papers ? '—' : (confs.some(c => c.Status === 'Current')
      ? `<span style="color:var(--green)">✔ received</span>${confs.filter(c => c.Status === 'Current').map(c => ` <a href="#" onclick="dlEv('${esc(c.EvId)}');return false">open</a>`).join('')}`
      : `<span class="warnic">✖ needed</span>`) + (mgr && e.JointAuditor ? ` <button onclick="jaConfForm('${esc(scope)}')">Upload</button>` : '');
  const rows = locs.map(l => `<tr><td><b>${esc(l.LocCode)}</b>${l.tampered ? ' <span class="warnic">⚠</span>' : ''}</td>
      <td>${esc(l.Name)}<div class="muted">${esc(l.State || '')}${l.GSTIN ? ' · ' + esc(l.GSTIN) : ''}</div></td>
      <td>${l.RiskRating ? `<span class="badge ${l.RiskRating === 'High' ? 'w-Returned' : l.RiskRating === 'Medium' ? 'w-Awaiting' : 'w-Reviewed'}">${esc(l.RiskRating)}</span>` : '<span class="muted">—</span>'}
        ${l.Materiality ? `<div class="muted">PM ₹${esc(l.Materiality)}</div>` : ''}</td>
      <td>${esc(l.Allocation || 'Our firm')}</td>
      <td>${l.total ? l.done + ' / ' + l.total : '—'}</td>
      <td>${l.actualHours}${l.BudgetHours ? ' / ' + esc(l.BudgetHours) : ''} h${l.BudgetHours && l.actualHours > Number(l.BudgetHours) ? ' <span class="warnic" title="Over budget">!</span>' : ''}</td>
      <td>${e.JointAuditor ? jaCell(l.jaPapers, l.jaConfirmations, l.LocCode) : '—'}</td>
      <td style="white-space:nowrap">${mgr ? `<button onclick="plantMeta('${esc(l.LocCode)}')">Planning</button> ` : ''}${canWork(r) ? `<button onclick="visitForm('${esc(l.LocCode)}')">Log visit</button> ` : ''}
        <button onclick="plantReport('${esc(l.LocCode)}')">Report</button>
        ${isPartner() && !isAdmin() && e.JointAuditor ? ` <button onclick="allocForm({locCode:'${esc(l.LocCode)}'}, '${esc(l.Allocation)}', '${esc(l.LocCode + ' ' + l.Name)}')">Allocation</button>` : ''}</td></tr>`).join('');
  const entityRow = e.JointAuditor && r.entityJaPapers ? `<tr><td></td><td>Entity / head office papers allotted to joint auditor (${r.entityJaPapers})</td><td></td><td>Joint auditor</td><td></td><td></td>
      <td>${jaCell(r.entityJaPapers, r.entityJaConfirmations, 'ENTITY')}</td><td></td></tr>` : '';
  const a6 = e.JointAuditor ? `<div class="banner ${r.a6Ready ? 'good' : 'ASSEMBLY'}" style="margin-top:8px">${r.a6Ready
      ? '✔ A6 division of work signed by both firms and reviewed – allocation can follow it.'
      : 'Allocation to the joint auditor or as a common area is locked until A6 has the division-of-work letter signed by both firms attached, and is prepared and reviewed.'}</div>` : '';
  return `<div class="card"><div class="bar" style="justify-content:space-between"><h4 style="margin:0">Plants / locations (${r.locations.length}) – riskiest first</h4>
      <div class="bar">${canAdd ? '<button class="pri" onclick="addPlant()">+ Add plant</button>' : ''}${r.locations.length ? '<button onclick="visitLog()">Visit log</button>' : ''}</div></div>
    ${a6}
    <table style="margin-top:8px"><thead><tr><th>Code</th><th>Plant</th><th>Risk / PM</th><th>Allotted to</th><th>Our papers</th><th>Hours (actual / budget)</th><th>Joint auditor confirmation</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" class="muted">No plants yet. Each plant added gets 12 working papers (purchases, sales, MIGO/MIRO, inventory, imports, payroll, TDS, GST, RCM, bank, cash, inter-plant & cut-off) with a step-by-step programme.</td></tr>'}${entityRow}</tbody></table></div>`;
}

function obsCard(r){
  const can = canWork(r);
  const locName = c => { const l = r.locations.find(x => x.LocCode === c); return l ? l.LocCode + ' ' + l.Name : 'Entity / head office'; };
  const list = r.observations.slice().sort((a, b) => (OBS_SORT[a.Status] - OBS_SORT[b.Status]) || (RISK_ORDER[a.Risk] - RISK_ORDER[b.Risk]));
  const rows = list.map(o => `<tr class="click" onclick="obsForm('${esc(o.ObsId)}')"><td>${esc(locName(o.LocCode))}</td>
      <td><b>${esc(o.Title)}</b>${o.tampered ? ' <span class="warnic">⚠</span>' : ''}${o.Flags ? `<div class="muted">${esc(o.Flags)}</div>` : ''}</td>
      <td><span class="badge ${o.Risk === 'High' ? 'w-Returned' : o.Risk === 'Medium' ? 'w-Awaiting' : 'w-Reviewed'}">${esc(o.Risk)}</span></td>
      <td>${o.Amount ? '₹' + esc(o.Amount) : '—'}</td><td>${esc(o.Owner || '—')}<div class="muted">${fmtD(o.TargetDate)}</div></td>
      <td><span class="badge ${o.Status === 'Open' ? 'w-Returned' : o.Status === 'Agreed' ? 'w-Awaiting' : 'w-Reviewed'}">${esc(o.Status)}</span></td></tr>`).join('');
  const open = r.observations.filter(o => o.Status === 'Open').length;
  return `<div class="card"><div class="bar" style="justify-content:space-between"><h4 style="margin:0">Observations (${r.observations.length}${open ? ', ' + open + ' open' : ''})</h4>
      <div class="bar">${can ? '<button class="pri" onclick="obsForm()">+ Raise observation</button>' : ''}<button onclick="consolidatedReport()">Consolidated summary</button><button onclick="plantReport(\'\')">Head office report</button></div></div>
    <table style="margin-top:8px"><thead><tr><th>Plant</th><th>Observation</th><th>Risk</th><th>Amount</th><th>Owner / target</th><th>Status</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="muted">No observations yet. Raise them from here or from inside a working paper.</td></tr>'}</tbody></table></div>`;
}
const OBS_SORT = {Open: 0, Agreed: 1, Resolved: 2, Dropped: 3};

function obsForm(id, fromWp){
  const r = S.cur, can = canWork(r);
  const o = id ? r.observations.find(x => x.ObsId === id) : {LocCode: fromWp ? fromWp.LocCode || '' : '', WpId: fromWp ? fromWp.WpId : '', Risk: 'Medium', Status: 'Open', Flags: ''};
  const flags = String(o.Flags || '').split(',').map(s => s.trim());
  const wpOpts = [{v: '', l: '— none —'}].concat(r.wps.filter(w => w.Allocation !== 'Joint auditor').map(w => ({v: w.WpId, l: w.Ref + ' ' + w.Title})));
  const need = r.state !== 'OPEN';
  modal(`<h2>${id ? 'Observation' : 'Raise observation'}</h2>
    <div class="row"><div><label>Plant</label><select id="oL">${opts([{v:'', l:'Entity / head office'}].concat(r.locations.map(l => ({v:l.LocCode, l:l.LocCode + ' ' + l.Name}))), o.LocCode)}</select></div>
    <div><label>Working paper</label><select id="oW">${opts(wpOpts, o.WpId)}</select></div></div>
    <label>Title *</label><input id="oT" value="${esc(o.Title || '')}" placeholder="e.g. GRNs posted without gate entry">
    <label>Observation (condition, criteria, effect) *</label><textarea id="oO">${esc(o.Observation || '')}</textarea>
    <div class="row"><div><label>Amount involved (₹)</label><input id="oA" value="${esc(o.Amount || '')}"></div>
    <div><label>Risk *</label><select id="oR">${opts(['High','Medium','Low'], o.Risk)}</select></div>
    <div><label>Status</label><select id="oS">${opts(['Open','Agreed','Resolved','Dropped'], o.Status)}</select></div></div>
    <label>Root cause</label><textarea id="oC" style="min-height:50px">${esc(o.RootCause || '')}</textarea>
    <label>Recommendation</label><textarea id="oRe" style="min-height:50px">${esc(o.Recommendation || '')}</textarea>
    <label>Management response</label><textarea id="oM" style="min-height:50px">${esc(o.MgmtResponse || '')}</textarea>
    <div class="row"><div><label>Owner (client)</label><input id="oOw" value="${esc(o.Owner || '')}"></div><div><label>Target date</label><input id="oD" type="date" value="${esc(o.TargetDate || '')}"></div></div>
    <label>Affects statutory reporting</label><div class="chk">${r.obsFlags.map(f => `<label><input type="checkbox" class="of" value="${esc(f)}" ${flags.indexOf(f) >= 0 ? 'checked' : ''}>${esc(f)}</label>`).join('')}</div>
    <label>Status note (required for Resolved / Dropped)</label><textarea id="oN" style="min-height:40px">${esc(o.StatusNote || '')}</textarea>
    ${need && can ? '<label style="color:var(--red)">Reason (report already dated) *</label><textarea id="oX" style="min-height:40px"></textarea>' : ''}
    ${id ? `<p class="muted">Raised by ${esc(uname(o.RaisedBy))} on ${fmtDT(o.RaisedAt)} · last updated by ${esc(uname(o.UpdatedBy))} on ${fmtDT(o.UpdatedAt)}</p>` : ''}
    <div class="bar" style="margin-top:12px">${can ? '<button class="pri" id="sv">Save</button>' : ''}<button onclick="closeModal()">Close</button></div>`);
  if (!can) { document.querySelectorAll('#mbox input,#mbox select,#mbox textarea').forEach(x => x.disabled = true); return; }
  $('sv').onclick = () => call('saveObservation', S.token, r.eng.EngId, {ObsId: id || '', LocCode:$('oL').value, WpId:$('oW').value, Title:$('oT').value, Observation:$('oO').value,
      Amount:$('oA').value, Risk:$('oR').value, Status:$('oS').value, RootCause:$('oC').value, Recommendation:$('oRe').value, MgmtResponse:$('oM').value,
      Owner:$('oOw').value, TargetDate:$('oD').value, Flags: checked('of'), StatusNote:$('oN').value}, need ? $('oX').value : '')
    .then(res => refresh(res, 'Observation saved'));
}

function plantMeta(code){
  const l = S.cur.locations.find(x => x.LocCode === code);

    .then(r => refresh(r, 'Plant planning saved'));

function visitForm(code){
  const r = S.cur, team = [r.eng.Partner, r.eng.Manager].concat(String(r.eng.Team || '').split(',')).filter((u, i, a) => u && a.indexOf(u) === i);

function visitLog(){

function jaConfForm(scope){
  const r = S.cur, label = scope === 'ENTITY' ? 'entity / head office areas' : (r.locations.find(l => l.LocCode === scope) || {}).Name;
  modal(`<h2>Joint auditor's confirmation – ${esc(label)}</h2>
    <p class="muted">Upload ${esc(r.eng.JointAuditor)}'s confirmation or summary of findings for the areas allotted to them, so this file shows those areas were covered (SA 299).</p>
    <label>Description *</label><input id="jt" placeholder="e.g. ${esc(r.eng.JointAuditor)} – summary of findings, dated …">
    <label>File * (max ${r.maxUploadMb} MB – zip larger files)</label><input id="jf" type="file">
    ${r.state !== 'OPEN' ? '<label>Reason *</label><textarea id="jx" style="min-height:40px"></textarea>' : ''}
    <div class="bar" style="margin-top:12px"><button class="pri" id="sv">Upload</button><button onclick="closeModal()">Cancel</button></div>`);
  $('sv').onclick = async () => {
    const f = $('jf').files[0];
    if (!f) { toast('Choose a file', true); return; }
    if (f.size > r.maxUploadMb * 1048576) { toast('File is larger than ' + r.maxUploadMb + ' MB – zip or split it', true); return; }
    $('sv').disabled = true;
    const b64 = await fileToB64(f);
    call('uploadJaConfirmation', S.token, r.eng.EngId, scope, $('jt').value, f.name, f.type, b64, $('jx') ? $('jx').value : '')
      .then(res => refresh(res, 'Confirmation uploaded'));
    setTimeout(() => { if ($('sv')) $('sv').disabled = false; }, 4000);
  };
}

function plantReport(code){
  const r = S.cur, l = code ? r.locations.find(x => x.LocCode === code) : null;
  const list = r.observations.filter(o => (o.LocCode || '') === (code || '') && o.Status !== 'Dropped').sort((a, b) => RISK_ORDER[a.Risk] - RISK_ORDER[b.Risk]);
  const visits = r.visits.filter(v => v.LocCode === code).map(v => fmtD(v.VisitDate));
  const papers = r.wps.filter(w => code ? w.LocCode === code : (w.Section === 'Head office'));
  const cnt = k => list.filter(o => o.Risk === k).length;
  const sub = l ? `${esc(l.Name)}${l.State ? ', ' + esc(l.State) : ''}${l.GSTIN ? ' · GSTIN ' + esc(l.GSTIN) : ''}${visits.length ? ' · Visits: ' + visits.join(', ') : ''}${l.Allocation ? ' · Allotted to: ' + esc(l.Allocation) : ''}` : 'Head office and entity-level areas';
  reportFrame(reportHead(l ? 'Plant audit report – ' + l.LocCode : 'Head office audit report', sub) +
    `<h3>Summary</h3><p>${list.length} observation(s): ${cnt('High')} High, ${cnt('Medium')} Medium, ${cnt('Low')} Low. ${list.filter(o => o.Status === 'Open').length} awaiting management response.</p>

}
function consolidatedReport(){
  const r = S.cur, obs = r.observations.filter(o => o.Status !== 'Dropped');
  const scopes = [{c:'', n:'Head office / entity'}].concat(r.locations.map(l => ({c:l.LocCode, n:l.LocCode + ' ' + l.Name})));
  const matrix = scopes.map(s => { const m = obs.filter(o => (o.LocCode || '') === s.c); const k = x => m.filter(o => o.Risk === x).length;
    return `<tr><td>${esc(s.n)}</td><td>${k('High')}</td><td>${k('Medium')}</td><td>${k('Low')}</td><td>${m.filter(o => o.Status === 'Open').length}</td><td>${m.filter(o => o.Status === 'Resolved').length}</td></tr>`; }).join('');
  const groups = {};
  obs.forEach(o => { const key = o.Title.trim().toLowerCase(); (groups[key] = groups[key] || []).push(o); });
  const recurring = Object.keys(groups).filter(k => new Set(groups[k].map(o => o.LocCode || 'HO')).size > 1)
    .map(k => `<tr><td>${esc(groups[k][0].Title)}</td><td>${esc(groups[k].map(o => o.LocCode || 'HO').filter((x, i, a) => a.indexOf(x) === i).join(', '))}</td></tr>`).join('');
  const flagged = obs.filter(o => o.Flags);
  reportFrame(reportHead('Consolidated summary of observations', r.locations.length + ' plant(s) and head office') +
    `<h3>Observations by location and risk</h3><table><thead><tr><th>Location</th><th>High</th><th>Medium</th><th>Low</th><th>Open</th><th>Resolved</th></tr></thead><tbody>${matrix}</tbody></table>
    <h3>Recurring across locations (control themes)</h3>${recurring ? `<table><thead><tr><th>Observation</th><th>Locations</th></tr></thead><tbody>${recurring}</tbody></table>` : '<p class="muted">None – use the same title for the same issue at different plants to see themes here.</p>'}
    <h3>Matters affecting statutory reporting</h3>${flagged.length ? `<table><thead><tr><th>Location</th><th>Observation</th><th>Flags</th><th>Status</th></tr></thead><tbody>${flagged.map(o => `<tr><td>${esc(o.LocCode || 'HO')}</td><td>${esc(o.Title)}</td><td>${esc(o.Flags)}</td><td>${esc(o.Status)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">None flagged.</p>'}
    <h3>High-risk observations</h3>${obsTable(obs.filter(o => o.Risk === 'High'))}${signBlock()}`);
}

function openWp(id){
  const r = S.cur, st = r.state, e = r.eng, m = r.me;
  const wp = id ? r.wps.find(w => w.WpId === id) : {EngId:e.EngId, Ref:'', Section:'Substantive', Title:'', Assertions:'', Risk:'', Procedure:'', Conclusion:'', Link:'', Status:'New'};
  const jaPaper = wp.Allocation === 'Joint auditor';
  const canAct = m.isTeam && m.declOk && !isAdmin() && !r.engTampered && !wp.tampered && !jaPaper;
  const ro = !canAct || (st === 'LOCKED' && !isPartner());
  const needReason = st !== 'OPEN';
  const asr = String(wp.Assertions||'').split(',').map(s => s.trim());
  const link = safeUrl(wp.Link);
  const canPrep = id && !ro && !wp.PreparedBy;
  const canRev = id && !ro && isMgr() && wp.PreparedBy && !wp.ReviewedBy && wp.PreparedBy !== S.me.username;
  const canPart = id && !ro && m.isEP && wp.needsPartner && wp.ReviewedBy && !wp.PartnerBy;
  const canRet = id && !ro && isMgr() && wp.PreparedBy;
  const why = !m.isTeam ? 'You are not on this engagement team – view only.' : !m.declOk ? 'Make your independence declaration first – view only.' :
    (r.engTampered || wp.tampered) ? 'Integrity alert – blocked until a partner investigates.' :
    jaPaper ? 'Allotted to the joint auditor (' + (e.JointAuditor || '') + ') – performed and documented by that firm. View only.' :
    (st === 'LOCKED' && !isPartner()) ? 'File locked – view only.' : '';
  const secList = SECTIONS.concat(r.locations.map(l => 'Plant ' + l.LocCode + ' – ' + l.Name)).filter((s, i, a) => a.indexOf(s) === i);
  if (wp.Section && secList.indexOf(wp.Section) < 0) secList.push(wp.Section);
  modal(`<div class="bar" style="justify-content:space-between"><h2 style="margin:0">${id ? esc(wp.Ref)+' — '+esc(wp.Title) : 'New working paper'}</h2>${id ? wpBadge(wp.Status) : ''}</div>
    ${wp.tampered ? `<div class="banner bad" style="margin-top:12px">⚠ This working paper was changed outside the portal. ${isPartner() && !isAdmin() ? `<button class="warn" onclick="resolveInt('${esc(wp.WpId)}')">Investigate & resolve</button>` : 'A partner must investigate.'}</div>` : ''}
    ${wp.ReviewNote ? `<div class="banner ret" style="margin-top:12px"><b>Review note:</b> ${esc(wp.ReviewNote)}</div>` : ''}
    ${why ? `<p class="muted"><b>${esc(why)}</b></p>` : ''}
    ${(wp.PreparedBy || wp.ReviewedBy) && !ro ? '<p class="muted">Note: saving any change to this paper clears the existing sign-offs – it must be signed again.</p>' : ''}
    <div class="row"><div style="flex:0 0 110px;min-width:90px"><label>Ref *</label><input id="wRef" value="${esc(wp.Ref)}"></div>
      <div><label>Section</label><select id="wSec" ${wp.LocCode ? 'disabled' : ''}>${opts(secList, wp.Section)}</select></div>
      <div><label>Risk level</label><select id="wRisk">${opts(RISKS, wp.Risk, v => v || '— select —')}</select></div></div>
    <div class="muted">Engagement partner sign-off is required for significant-risk papers and for Planning, Risk assessment, Completion and Reporting sections.</div>
    <label>Title *</label><input id="wTitle" value="${esc(wp.Title)}">
    ${e.JointAuditor && id ? `<div class="muted" style="margin-top:8px">Allotted to: <b>${esc(wp.Allocation || 'Our firm')}</b>${isPartner() && !isAdmin() && m.isTeam ? ` · <a href="#" onclick="allocForm({wpId:'${esc(wp.WpId)}'}, '${esc(wp.Allocation || '')}', '${esc(wp.Ref)}');return false">change</a>` : ''}</div>` : ''}
    ${wp.Programme && !wp.Steps ? `<label>Planned procedures (audit programme from the agreed scope)</label><div class="decl" style="white-space:pre-wrap">${esc(wp.Programme)}</div>` : ''}
    ${stepsHtml(wp)}
    ${dataHtml(wp)}
    ${wp.Allocation === 'Common area' ? concHtml(wp) : ''}
    <label>Assertions covered</label><div class="chk">${ASSERTIONS.map(a => `<label><input type="checkbox" class="as" value="${esc(a)}" ${asr.indexOf(a)>=0?'checked':''}>${esc(a)}</label>`).join('')}</div>
    <label>Procedure performed – nature, timing, extent; population, sample size and selection basis (SA 230 / SA 530)</label><textarea id="wProc">${esc(wp.Procedure)}</textarea>
    <label>Results, exceptions and conclusion</label><textarea id="wConc">${esc(wp.Conclusion)}</textarea>
    <label>Other reference (optional – e.g. client system report name). Upload evidence files below.</label><input id="wLink" value="${esc(wp.Link)}">
    ${link ? `<div class="muted" style="margin-top:4px"><a href="${esc(link)}" target="_blank" rel="noopener">Open link ↗</a></div>` : ''}
    ${id ? evidenceHtml(wp, ro) : '<p class="muted">Save the working paper first, then attach evidence files.</p>'}
    ${needReason && !ro ? `<label style="color:var(--red)">Reason for change / sign-off after report date * (recorded in audit trail)</label><textarea id="wReason" style="min-height:50px"></textarea>` : ''}
    ${id ? `<p class="muted">Version ${esc(wp.Version)} · last changed by ${esc(uname(wp.UpdatedBy))} on ${fmtDT(wp.UpdatedAt)}<br>
      Prepared: ${wp.PreparedBy ? esc(uname(wp.PreparedBy))+' on '+fmtDT(wp.PreparedAt) : '—'} · Reviewed: ${wp.ReviewedBy ? esc(uname(wp.ReviewedBy))+' on '+fmtDT(wp.ReviewedAt) : '—'} ·
      Partner: ${!wp.needsPartner ? 'not required' : wp.PartnerBy ? esc(uname(wp.PartnerBy))+' on '+fmtDT(wp.PartnerAt) : 'pending'}</p>` : ''}
    <div class="bar" style="margin-top:14px">
      ${ro ? '' : '<button class="pri" id="wSave">Save</button>'}
      ${canPrep ? '<button class="ok" id="wPrep">Sign as preparer</button>' : ''}
      ${canRev ? '<button class="ok" id="wRev">Sign as reviewer</button>' : ''}
      ${canPart ? '<button class="ok" id="wPart">Engagement partner sign-off</button>' : ''}
      ${canRet ? '<button class="warn" id="wRet">Return with review note</button>' : ''}
      ${id && canWork(r) && !jaPaper ? `<button onclick="obsForm('', {WpId:'${esc(wp.WpId)}', LocCode:'${esc(wp.LocCode || '')}'})">Raise observation</button>` : ''}
      <button onclick="closeModal()">Close</button></div>`);
  S.wpCtx = {wpId: wp.WpId, needReason: needReason, dirty: false};
  if (ro) { document.querySelectorAll('#mbox input,#mbox select,#mbox textarea').forEach(x => x.disabled = true); return; }
  let dirty = false;
  $('mbox').addEventListener('input', ev => { if (ev.target.id !== 'wReason') { dirty = true; S.wpCtx.dirty = true; } });
  const reason = () => needReason ? $('wReason').value : '';
  $('wSave').onclick = () => call('saveWorkingPaper', S.token, {
      WpId: wp.WpId || '', EngId: wp.EngId, Ref: $('wRef').value, Section: $('wSec').value, Title: $('wTitle').value,
      Assertions: checked('as').join(', '), Risk: $('wRisk').value, Procedure: $('wProc').value, Conclusion: $('wConc').value, Link: $('wLink').value,
      Steps: collectSteps(), DataSource: collectData(), JaConcurrence: collectConc()
    }, reason()).then(res => refresh(res, 'Saved'));
  if ($('addStep')) $('addStep').onclick = () => {
    const box = $('stepsBox'), i = box.querySelectorAll('.stp').length;
    box.insertAdjacentHTML('beforeend', stepRow({t: '', s: '', n: ''}, i, false, true));
    dirty = true; S.wpCtx.dirty = true;
  };
  const msgs = {prepare:'Signed as preparer', review:'Signed as reviewer', partner:'Partner sign-off recorded'};
  const sign = type => { if (dirty) { toast('Save your changes first, then sign.', true); return; } call('signOff', S.token, wp.EngId, wp.WpId, type, reason()).then(res => refresh(res, msgs[type])); };
  if (canPrep) $('wPrep').onclick = () => sign('prepare');
  if (canRev) $('wRev').onclick = () => sign('review');
  if (canPart) $('wPart').onclick = () => sign('partner');
  if (canRet) $('wRet').onclick = () => {
    const note = window.prompt('Review note – what must the preparer do?');
    if (note === null) return;
    const full = needReason && reason() ? note + ' | Reason: ' + reason() : note;
    call('signOff', S.token, wp.EngId, wp.WpId, 'return', full).then(res => refresh(res, 'Returned to preparer'));
  };
}

/* ---------- step checklist, data source, concurrence (v1.4) ---------- */
function pj(s, d){ if (!s) return d; try { return JSON.parse(s); } catch (e) { return d; } }
function stepRow(st, i, ro, custom){
  return `<div class="stp" data-i="${i}" style="border-bottom:1px solid var(--line);padding:8px 0">
    <div style="font-size:13px"><b>${i + 1}.</b> ${custom ? `<input class="st-t" placeholder="Describe the additional step" style="width:85%">` : esc(st.t)}</div>
    <div class="row" style="margin-top:6px"><div style="flex:0 0 150px;min-width:130px"><select class="st-s" ${ro ? 'disabled' : ''}>${opts([{v:'', l:'— status —'}, 'Done', 'Exception', 'N.A.'], st.s)}</select></div>
    <div><input class="st-n" value="${esc(st.n || '')}" placeholder="Note / reference (required for Exception or N.A.)" ${ro ? 'disabled' : ''}></div></div></div>`;
}
function stepsHtml(wp){
  const steps = pj(wp.Steps, []);
  if (!steps.length) return '';
  const done = steps.filter(s => s.s).length;
  const ro = !(S.cur.me.isTeam && S.cur.me.declOk) || wp.Allocation === 'Joint auditor';
  const ref = (String(wp.Programme || '').match(/S\/4HANA:.*$/) || [''])[0];
  return `<label>Audit programme – ${done} of ${steps.length} steps answered (all must be answered before signing)</label>
    <div id="stepsBox" class="decl" style="background:#fff">${steps.map((s, i) => stepRow(s, i, ro, false)).join('')}</div>
    ${ref ? `<div class="muted" style="margin-top:4px">${esc(ref)} (indicative – confirm with the client's SAP team)</div>` : ''}
    ${!ro ? '<div class="bar" style="margin-top:6px"><button type="button" id="addStep">+ Add step</button></div>' : ''}`;
}
function collectSteps(){
  const box = $('stepsBox');
  if (!box) return undefined;

      ${l.newerVersion ? ` <span style="color:var(--amber);font-size:12px">· newer v${esc(l.newerVersion)} now in permanent file</span>` : ''}${l.Status === 'Withdrawn' ? ' <span class="muted">(later withdrawn from permanent file)</span>' : ''}
      <div class="muted">Referenced by ${esc(uname(l.LinkedBy))} · ${fmtDT(l.LinkedAt)}</div></td>
      <td style="text-align:right"><button onclick="dlEv('${esc(l.EvId)}')">Open</button>${!ro ? ` <button class="warn" onclick="unlinkEv('${esc(l.LinkId)}')">Remove</button>` : ''}</td></tr>`).join('');

    <p class="muted">Files go into the portal's private evidence folder and are never deleted. Adding or removing evidence creates a new version of the paper and clears its sign-offs.</p>` : ''}`;
}
function fileToB64(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(file); }); }
function reasonField(need){ return need ? `<label style="color:var(--red)">Reason (report already dated) *</label><textarea id="xr" style="min-height:50px"></textarea>` : ''; }
function afterWp(res, msg, wpId){ refresh(res, msg); if (wpId) openWp(wpId); }
function guardDirty(){ if (S.wpCtx && S.wpCtx.dirty) { toast('Save your changes to the working paper first.', true); return false; } return true; }

function attachEv(){
  if (!guardDirty()) return;
  const c = S.wpCtx, max = S.cur.maxUploadMb;
  modal(`<h2>Attach evidence file</h2>
    <label>Title / description *</label><input id="et" placeholder="e.g. Sales invoices sample – 40 items (MUS)">
    <label>File * (max ${max} MB)</label><input id="ef" type="file">
    ${reasonField(c.needReason)}
    <div class="bar" style="margin-top:14px"><button class="pri" id="sv">Upload</button><button onclick="openWp('${esc(c.wpId)}')">Cancel</button></div>`);
  $('sv').onclick = async () => {
    const f = $('ef').files[0];
    if (!f) { toast('Choose a file', true); return; }
    if (f.size > max * 1048576) { toast('File is larger than ' + max + ' MB – compress or split it', true); return; }
    if (!$('et').value.trim()) { toast('Give the document a title', true); return; }
    $('sv').disabled = true;
    const b64 = await fileToB64(f);
    call('uploadEvidence', S.token, {EngId: S.cur.eng.EngId, WpId: c.wpId, Title: $('et').value, FileName: f.name, MimeType: f.type}, b64, c.needReason ? $('xr').value : '')
      .then(res => afterWp(res, 'File uploaded and fingerprinted', c.wpId));
    setTimeout(() => { if ($('sv')) $('sv').disabled = false; }, 4000);
  };
}
function refPf(){
  if (!guardDirty()) return;
  const c = S.wpCtx, docs = S.cur.pfDocs;
  if (!docs.length) { toast('The permanent file has no documents yet – add them under "Permanent file"', true); return; }
  modal(`<h2>Reference a permanent file document</h2>
    <p class="muted">The reference records the exact version used for this year's audit. If the document is updated later, this paper still shows the version relied on.</p>
    <label>Document *</label><select id="pd">${opts(docs.map(d => ({v: d.EvId, l: d.PfSection + ' – ' + d.Title + ' (v' + d.Version + ')'})))}</select>
    ${reasonField(c.needReason)}
    <div class="bar" style="margin-top:14px"><button class="pri" id="sv">Add reference</button><button onclick="openWp('${esc(c.wpId)}')">Cancel</button></div>`);
  $('sv').onclick = () => call('linkPf', S.token, S.cur.eng.EngId, c.wpId, $('pd').value, c.needReason ? $('xr').value : '')
    .then(res => afterWp(res, 'Reference added', c.wpId));
}
function unlinkEv(linkId){
  if (!guardDirty()) return;
  const why = window.prompt('Reason for removing this reference:');
  if (!why) return;
  const c = S.wpCtx;
  call('unlinkPf', S.token, S.cur.eng.EngId, linkId, why).then(res => afterWp(res, 'Reference removed', c.wpId));
}
function withdrawEv(evId, pf){
  if (!pf && !guardDirty()) return;
  const why = window.prompt('Reason for withdrawing this document (it stays in the file history and in Drive):');
  if (!why) return;
  const c = S.wpCtx;
  call('withdrawEvidence', S.token, S.cur.eng.EngId, evId, why).then(res => {
    if (pf) { S.pf = res; renderPf(); toast('Document withdrawn'); } else afterWp(res, 'Evidence withdrawn', c.wpId);
  });
}
function dlEv(evId){
  call('downloadEvidence', S.token, S.cur.eng.EngId, evId).then(r => {
    const bin = atob(r.b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], {type: r.mime}));
    const a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    if (r.verified) toast('✔ File verified – identical to the uploaded file. Downloading…'); else toast('⚠ ' + r.issue + ' – report this to a partner', true);
  });
}

    <div class="bar" style="margin-top:16px"><button class="pri" id="sv">Save</button><button onclick="closeModal()">Cancel</button></div>`);
  $('sv').onclick = () => call('saveUser', S.token, {Username: un || $('uU').value, Name:$('uN').value, Role:$('uR').value, Active: un ? $('uA').value : 'Yes', Password:$('uP').value}, !un)
    .then(() => { closeModal(); toast('User saved'); call('getBootstrap', S.token).then(d => { S.data = d; showUsers(); }); });
}
function changePw(){
  modal(`<h2>Change password</h2><label>Current password</label><input id="p0" type="password">
    <label>New password (min 8 characters)</label><input id="p1" type="password"><label>Confirm new password</label><input id="p2" type="password">
    <div class="bar" style="margin-top:16px"><button class="pri" id="sv">Change</button><button onclick="closeModal()">Cancel</button></div>`);
  $('sv').onclick = () => { if ($('p1').value !== $('p2').value) { toast('New passwords do not match', true); return; }
    call('changePassword', S.token, $('p0').value, $('p1').value).then(() => { closeModal(); toast('Password changed'); }); };
}

/* ---------- start ---------- */
if (S.token) loadHome(); else renderLogin();
</script>
</body>
